# Placetta's Supabase project. Used by the Supabase CLI (npm run launch deploys the functions with it).
project_id = "esquxzcfsylffuijvzec"

# These three are called by Stripe, the OAuth providers and calendar apps, which can't send a Supabase session.
# Each checks its own signature or token instead.
[functions.stripe-webhook]
verify_jwt = false

[functions.oauth-callback]
verify_jwt = false

[functions.calendar-feed]
verify_jwt = false

[functions.monitor]
verify_jwt = false

# file checks every request itself (the person's session, the monitor key, or the Telnyx signature on fax webhooks),
# and the monitor's daily sweep and Telnyx's fax webhooks carry no Supabase session.
[functions.file]
verify_jwt = false

[functions.agent-run]
verify_jwt = false

# Odelia by text and phone: Telnyx calls these (each checks the Telnyx signature, its per-call token or the monitor key).
[functions.odelia-sms]
verify_jwt = false

[functions.odelia-mail]
verify_jwt = false

[functions.odelia-voice]
verify_jwt = false

# Odelia in a business's own Slack, Lark and WeChat: their servers call it with no Supabase session, and it checks each
# one's own signature (and WeChat's safe-mode seal).
[functions.chat-events]
verify_jwt = false

# The partner API and the embedded plan box: partners' servers call it with an API key, and the box on a partner's
# own site calls it with no session at all. It checks the key itself (only its SHA-256 is stored) and rate-limits both.
[functions.partner-api]
verify_jwt = false

# SCIM provisioning: a customer's identity provider (Okta, Entra ID...) calls it with the workspace's SCIM token, not a
# Supabase session. It checks the token itself (only its SHA-256 is stored) and rate-limits each token.
[functions.scim]
verify_jwt = false
