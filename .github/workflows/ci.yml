# Every change is checked before it ships: types, the agent and planning tests, the team-chat checks, every server
# function type-checked, every migration applied to a fresh Postgres with the database tests run against it, and the
# security checks (no secrets in the commits, no high or critical advisory in any dependency, Dependabot watching
# every manifest). Server functions deploy only after this passes on main (deploy-functions.yml).
# Branch protection requires all four jobs, and eval.yml's eval job (no regression on real models), before a merge: .github/branch-protection.json, docs/soc2/runbooks/branch-protection.md.
# Every action is pinned to a full commit SHA (the tag it was taken from is in the comment), so a moved or hijacked tag
# can't change what runs here; Dependabot's github-actions entry proposes new SHAs as pull requests.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  app:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Types
        run: npx tsc -b
      - name: Plain words in the interface
        run: node scripts/plain-words.mjs
      - run: npm run test:agent
      # the agent loop against a scripted model that misbehaves on purpose: approvals, made-up ids, planted
      # instructions, SSNs, remote channels, limits, racing runs, Chinese, every tool, model failover
      - run: npm run test:extreme
      # the plush bot's animation math through its extremes: no negative scale or radius ever reaches the canvas
      - run: npm run test:bot
      # what talking leaves in the message box (um and uh out, everything else as said) and what voice notes cost
      - run: npm run test:speech
      # a refusal never ends at "no": every refusal the server's tools throw gets the next step and who takes it, and
      # the safety refusals (no CAPTCHA bypass, nothing filed or paid without approval) stay refusals
      - run: npm run test:next-path
      # the prompt-injection red team: hostile emails, PDFs, pages, chats, lessons and form fields, each against a
      # model that obeys them; every one must be stopped by Placetta's own code
      - run: npm run test:redteam
      - run: npm run test:reply-leak
      # the live evaluation's harness, on its scripted model (no key in CI): scenarios, tools, graders and report
      - run: npm run eval:live -- --dry --out /tmp/eval.md --json /tmp/eval.json
      # the harness's own plumbing: argument checks, A/B, the dated history, the merge gate, skipping without a key
      - run: npm run test:eval
      - run: npm run test:plan
      # every form Placetta fills on the agency's own PDF: filled with test answers, then read back line by line
      - run: npm run test:forms
      - run: npm run test:smart
      - run: npm run test:flow
      - run: npm run test:channels
      # every filing destination cites its agency page and passes the host rules, every one names a registry form, and
      # docs/FILING_COVERAGE.md matches what the script generates
      - name: Filing coverage
        run: node scripts/filing-coverage.mjs --check
      # the target markets: every filing in each city's and state's plan is on its own jurisdiction's form, every mapped
      # PDF is on that agency's site, and docs/MARKET_COVERAGE.md matches what the script generates
      - name: Market coverage
        run: npm run test:markets
      # the website as a crawler with no JavaScript sees it: robots, sitemaps, llms.txt, one h1, canonicals, JSON-LD that
      # parses and matches the visible FAQ, answer-first guides, no indexed near-duplicates, every page rebuilt (npm run seo)
      - name: Search and AI crawler checks
        run: npm run test:seo
      # the Markdown copy of every page and the Atom and RSS feeds made after the build (scripts/agent-ready.mjs)
      - name: Agent-readable copies and feeds
        run: node --test scripts/agent-ready.test.mjs
      - name: Production build
        run: npx vite build
      # what anyone can read with F12: none of Odelia's instructions, tool definitions or playbooks, no model id, no
      # source map and no secret in dist/ (scripts/leak-test.mjs; the build itself refuses server-only imports)
      - name: Nothing server-only ships
        run: npm run test:leak
      # the portal filer: types, and its tests (its database access goes only through the filer functions; its image
      # runs as a non-root user; its rerouting; and replay.test.ts, which drives each agency playbook in Chromium, so the
      # filer's own Playwright browser is installed first)
      - name: Filer types and tests
        run: |
          npm ci --prefix worker/filer
          npm run typecheck --prefix worker/filer
          cd worker/filer && node node_modules/playwright-core/cli.js install --with-deps chromium && node --experimental-strip-types --test test/store.test.ts test/docker.test.ts test/reroute.test.ts test/replay.test.ts
      # the built app (sample mode) in Chromium at 1440 and 390: Odelia is sent several messages and watched for 20
      # seconds through working, done and idle; any uncaught error or a blank page fails (scripts/crash-smoke.mjs,
      # docs/LESSONS.md). It uses the filer's Playwright and the Chromium the step above installed.
      - name: No crash and no blank page in a real browser
        run: npm run test:crash
  functions:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:agent
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      # Supabase refuses a function over 5 MB and the old code stays live (agent-run, 2026-10-23): fail well before that
      - name: Every server function fits the deploy limit
        run: node scripts/function-size.mjs deno
      - name: Type-check every server function
        run: for f in supabase/functions/*/index.ts; do deno check "$f" || exit 1; done
      # the functions' own tests (every *_test.ts and *.test.ts): among them the MCP client against a fake MCP server and
      # sign-in server (address guard, sessions, streams, limits, PKCE), and who may connect, use and approve apps
      - name: Server function tests
        run: deno test -A supabase/functions
  database:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    services:
      # The same major and minor version as production (Supabase reports Postgres 17.11)
      postgres:
        image: postgres:17.11
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Migrations and database tests
        run: bash scripts/test-db.sh
      # pg_dump must be at least the server's version to back it up
      - name: Postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      # the off-site backup (scripts/db-backup.sh) restored by the drill script (scripts/restore-test.sh), on a stand-in
      - name: Backup and restore drill
        run: bash scripts/restore-selftest.sh
  # the two-account test (scripts/tenancy/run.ts): account B and the anon key try to read, change and delete every kind of
  # account A's records through PostgREST, every RPC, every edge function action and storage, on a throwaway local
  # Postgres with every migration, PostgREST and the real functions; nothing of A's may come back or change
  tenancy:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - name: Two-account test
        run: PG_BIN=/usr/lib/postgresql/16/bin deno run -A --no-check --no-lock --node-modules-dir=none scripts/tenancy/run.ts
  # docs/soc2/policies/secure-development.md and vulnerability-management.md
  security:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: No high or critical advisory in production dependencies
        run: |
          npm audit --omit=dev --audit-level=high --package-lock-only
          npm audit --omit=dev --audit-level=high --package-lock-only --prefix worker/filer
      # The build tools (Vite, esbuild, TypeScript) make what ships, so they're held to the same bar
      - name: No high or critical advisory in build and test dependencies
        run: |
          npm audit --audit-level=high --package-lock-only
          npm audit --audit-level=high --package-lock-only --prefix worker/filer
      - name: Dependabot watches every manifest
        run: node scripts/check-dependabot.mjs
      - name: Evidence collector, log export, access review and key minting tests
        run: node --test scripts/soc2-evidence.test.mjs scripts/log-export.test.mjs scripts/access-review.test.mjs scripts/mint-role-key.test.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: false }
      # Built from the Go module proxy at an exact version, so the download is checked against sum.golang.org.
      # (gitleaks v8.30.1 needs Go 1.24.11 or newer; the latest stable Go always is.)
      - name: Install gitleaks v8.30.1
        run: go install -ldflags "-X github.com/zricethezav/gitleaks/v8/version.Version=v8.30.1" github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: No secrets in the commits
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        # A pull request: its own commits. A push to main: what the push added. Run by hand: the whole history.
        # Exceptions (test fixtures, keys that are public by design) are listed, with reasons, in .github/gitleaks.toml.
        run: |
          case "$EVENT" in
            pull_request) range="$BASE..$HEAD" ;;
            push) if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$AFTER"; else range="-1 $AFTER"; fi ;;
            *) range="" ;;
          esac
          args=(git --config .github/gitleaks.toml --redact --no-banner --max-target-megabytes 5)
          if [ -n "$range" ]; then args+=(--log-opts="$range"); fi
          "$(go env GOPATH)/bin/gitleaks" version
          "$(go env GOPATH)/bin/gitleaks" "${args[@]}" .
