# Deploys every Supabase server function when they (or Odelia's code in src/) change on main.
# Odelia's server copy is rebuilt from src first, so the server never runs an older agent than the app.
# Updates the live database first (scripts/apply-migrations.mjs), then deploys. Needs one repository secret:
# SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens). Without it, this skips.
name: Deploy server functions
# Only after CI passes on main: a change that fails its checks never reaches the server.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy-functions, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check the token
        id: tok
        run: if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::Add SUPABASE_ACCESS_TOKEN to the repository secrets to deploy functions."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tok.outputs.ok
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.tok.outputs.ok
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.tok.outputs.ok
      - name: Update the database first (migrations the live project hasn't run)
        if: steps.tok.outputs.ok
        run: node scripts/apply-migrations.mjs
      - name: Rebuild Odelia's server copy
        if: steps.tok.outputs.ok
        run: npm run build:agent
      - name: Deploy
        if: steps.tok.outputs.ok
        # The CLI at an exact version, so a new release can't change a deploy without a pull request
        run: npx --yes supabase@2.120.0 functions deploy --project-ref esquxzcfsylffuijvzec --use-api
