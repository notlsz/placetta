# Downloads the agencies' own PDFs listed in scripts/official-pdfs.txt (one "id url" per line) and keeps them as a run
# artifact, so the forms library can read each form's fillable boxes and check a filled copy. Run by hand.
name: Fetch official forms
on: workflow_dispatch
permissions: { contents: read }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p out
          while read -r id url; do
            [ -z "$id" ] && continue
            code=$(curl -sSL --max-time 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -o "out/$id.pdf" -w "%{http_code}" "$url" || echo ERR)
            echo "$id $code $(head -c 5 "out/$id.pdf" 2>/dev/null | tr -dc '[:print:]') $(stat -c %s "out/$id.pdf" 2>/dev/null) $url" | tee -a out/index.txt
          done < scripts/official-pdfs.txt
      - uses: actions/upload-artifact@v4
        with: { name: official-pdfs, path: out }
