# Downloads the agencies' own PDFs listed in scripts/official-pdfs.txt (one "id url" per line) and keeps them as a run
# artifact and on the official-pdfs branch, so the forms library can read each form's fillable boxes and check a filled copy. Run by hand.
name: Fetch official forms
on: workflow_dispatch
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download
        run: |
          mkdir -p out
          while read -r id url; do
            [ -z "$id" ] && continue
            code=$(curl -sSL --max-time 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -o "out/$id.pdf" -w "%{http_code}" "$url" || echo ERR)
            echo "$id $code $(head -c 5 "out/$id.pdf" 2>/dev/null | tr -dc '[:print:]') $(stat -c %s "out/$id.pdf" 2>/dev/null) $url" | tee -a out/index.txt
          done < scripts/official-pdfs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: official-pdfs, path: out }
      - name: Keep them on the official-pdfs branch
        run: |
          cd out
          git init -q -b official-pdfs
          git config user.name "placetta-bot"; git config user.email "bot@placetta.com"
          git add -A && git commit -qm "Official PDFs as downloaded $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" official-pdfs
