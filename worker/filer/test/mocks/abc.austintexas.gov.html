<!doctype html>
<!-- Static copy of the AB+C Portal pages the City of Austin's "How to Schedule an Inspection Online" documents (sign in,
     My Inspections with the permit's check box and Schedule Inspection, the request with the inspection's check box, a
     date and comments, and the confirmation note at the top of My Inspections), for a building final. Written from the
     guide, not recorded from the live site. -->
<html><head><meta name="replay-form" content="insp-aus-building-final"></head><body>
<template data-title="Login">
  <h1>Login</h1>
  <p><label for="u">Username</label><input id="u"></p>
  <p><label for="p">Password</label><input id="p" type="password"></p>
  <button>Log In</button>
</template>
<template data-title="My Inspections">
  <h1>My Inspections</h1>
  <p><label><input type="checkbox"> 2026-012345 BP</label></p>
  <button>Schedule Inspection</button> <button>Cancel Inspection</button> <button>View Inspections</button>
</template>
<template data-title="Schedule Inspection">
  <h1>Schedule Inspection</h1>
  <p><label><input type="checkbox"> 101 Building Final</label></p>
  <p><label for="d">Requested Date</label><input id="d"></p>
  <p><label for="c">Comments</label><textarea id="c"></textarea></p>
  <button>Request Inspection</button>
</template>
<template data-title="My Inspections">
  <h1>My Inspections</h1>
  <p>Inspection 101 Building Final has been successfully scheduled.</p>
  <button>View Inspections</button>
</template>
</body></html>
