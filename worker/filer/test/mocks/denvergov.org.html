<!doctype html>
<!-- Static copy of the Denver e-permits pages its application guide and the commercial zoning permit page document
     (register or sign in, Development Services > Apply for a permit, "Zoning Permit", documents, review, fees).
     Written from the guides, not recorded from the live site. -->
<html><head><meta name="replay-form" content="den-zoning"></head><body>
<template data-title="Login">
  <h1>Login</h1>
  <p><label for="u">User Name or E-mail</label><input id="u"></p>
  <p><label for="p">Password</label><input id="p" type="password"></p>
  <button>Login</button>
</template>
<template data-title="Home">
  <h1>Home</h1>
  <nav><a href="#ds">Development Services</a></nav>
  <p><a href="#apply">Apply for a permit</a></p>
</template>
<template data-title="Select a Record Type">
  <h1>Select a Record Type</h1>
  <p><label><input type="radio" name="t"> Zoning Permit</label></p>
  <button>Continue Application</button>
</template>
<template data-title="Step 3: Documents">
  <h1>Step 3: Documents</h1>
  <p><label for="f">Floor plan or site plan</label><input id="f" type="file"></p>
  <button>Continue Application</button>
</template>
<template data-title="Step 4: Review">
  <h1>Step 4: Review</h1>
  <p><label><input type="checkbox"> I agree to the certification.</label></p>
  <button>Continue Application</button>
</template>
<template data-title="Step 5: Pay Fees">
  <h1>Step 5: Pay Fees</h1>
  <p>Zoning permit fee: $50.00</p>
  <button>Check Out</button>
</template>
</body></html>
