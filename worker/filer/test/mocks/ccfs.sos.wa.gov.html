<!doctype html>
<!-- Static copy of the CCFS pages the Secretary of State's "Start a Domestic (WA) Limited Liability Company (LLC)
     Online" instructions document. Written from the instructions, not recorded from the live site. -->
<html><head><meta name="replay-form" content="wa-sos"></head><body>
<template data-title="Login">
  <h1>Login</h1>
  <p><label for="u">Username</label><input id="u"></p>
  <p><label for="p">Password</label><input id="p" type="password"></p>
  <button>Login</button>
</template>
<template data-title="Dashboard">
  <h1>Dashboard</h1>
  <nav><a href="#create">Create or Register a Business</a> <a href="#manage">Manage My Business</a></nav>
</template>
<template data-title="Create or Register a Business">
  <h1>Create or Register a Business</h1>
  <p><label><input type="radio" name="w"> I would like to form a Washington State business.</label></p>
  <p><label for="t">Business Type</label><select id="t"><option></option><option>WA Limited Liability Company</option></select></p>
  <button>Back</button> <button>Continue</button>
</template>
<template data-title="Business Information">
  <h1>Business Information</h1>
  <p><label for="n">Business Name</label><input id="n"></p>
  <h2>Registered Agent</h2><p><label for="ra">Registered Agent Name</label><input id="ra"></p>
  <button>Continue</button>
</template>
<template data-title="Authorized Person">
  <h1>Authorized Person</h1>
  <p><label for="fn">First Name</label><input id="fn"></p>
  <p><label for="ln">Last Name</label><input id="ln"></p>
  <p><label><input type="checkbox"> This document is hereby executed under penalty of law and is to the best of my knowledge, true and correct.</label></p>
  <button>Continue</button>
</template>
<template data-title="Review">
  <h1>Review</h1>
  <p>Business Name: Lotus Tea House LLC</p>
  <button>Back</button> <button>Add to Cart</button>
</template>
<template data-title="Shopping Cart">
  <h1>Shopping Cart</h1>
  <p>Certificate of Formation: $180.00</p>
  <button>Checkout</button>
</template>
<template data-title="Order Confirmation">
  <h1>Order Confirmation</h1>
  <p>Order number: 012345</p>
</template>
</body></html>
