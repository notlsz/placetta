<!doctype html>
<!-- Static copy of the Accela Citizen Access pages the DallasNow guide documents (Applying for a Commercial Alteration
     and Addition Application, steps 1 to 28), for the Certificate of Occupancy record. One <template> per page, in the
     order of the dal-co playbook. Written from the guide's text and screenshots, not recorded from the live site. -->
<html><head><meta name="replay-form" content="dal-co"></head><body>
<template data-title="Login">
  <h1>Login</h1>
  <p><label for="u">User Name or E-mail</label><input id="u"></p>
  <p><label for="p">Password</label><input id="p" type="password"></p>
  <button>Sign In</button>
</template>
<template data-title="Home">
  <h1>Home</h1>
  <nav><a href="#building">Building</a> <a href="#planning">Planning</a> <a href="#fire">Fire</a></nav>
  <p><a href="#create">Create an Application</a></p>
</template>
<template data-title="General Disclaimer">
  <h1>General Disclaimer</h1>
  <p><label><input type="checkbox"> I have read and accepted the above terms.</label></p>
  <button>Continue Application</button>
</template>
<template data-title="Select a Record Type">
  <h1>Select a Record Type</h1>
  <h2>Commercial Permits</h2>
  <p><label><input type="radio" name="t"> Certificate of Occupancy</label></p>
  <p><label><input type="radio" name="t"> Commercial Alteration Addition Permit</label></p>
  <button>Continue Application</button>
</template>
<template data-title="Step 1: Contact Information">
  <h1>Step 1: Contact Information</h1>
  <h2>Applicant</h2><button>Select from Account</button>
  <h2>Property Owner</h2><button>Select from Account</button>
  <button>Continue Application</button>
</template>
<template data-title="Step 2: Work Location">
  <h1>Step 2: Work Location</h1>
  <p><label for="no">Street #</label><input id="no"></p>
  <p><label for="st">Street Name</label><input id="st"></p>
  <button>Search</button> <button>Continue Application</button>
</template>
<template data-title="Step 3: Project Information">
  <h1>Step 3: Project Information</h1>
  <p><label for="d">Detailed Description</label><textarea id="d"></textarea></p>
  <button>Continue Application</button>
</template>
<template data-title="Step 4: Support Documentation">
  <h1>Step 4: Support Documentation</h1>
  <p><label for="f">Attachment</label><input id="f" type="file"></p>
  <button>Add</button> <button>Continue Application</button>
</template>
<template data-title="Step 5: Review">
  <h1>Step 5: Review</h1>
  <p><label><input type="checkbox"> By checking this box, I agree to the above certification.</label></p>
  <button>Save and resume later</button> <button>Continue Application</button>
</template>
<template data-title="Step 6: Pay Fees">
  <h1>Step 6: Pay Fees</h1>
  <p>Application Fees: $219.00</p>
  <button>Check Out</button>
</template>
<template data-title="Record Issuance">
  <h1>Record Issuance</h1>
  <p>Your application has been successfully submitted. Record Number: CO-26-000123</p>
</template>
</body></html>
