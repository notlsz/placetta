<!doctype html>
<!-- Static copy of the eCorp pages the Georgia Secretary of State's Online Services User Guide documents (Customer Login,
     Business Formation, the formation sections, Certification, review, payment and Thank You). Written from the guide,
     not recorded from the live site. -->
<html><head><meta name="replay-form" content="ga-sos"></head><body>
<template data-title="Customer Login">
  <h1>Customer Login</h1>
  <p><label for="u">User ID</label><input id="u"></p>
  <p><label for="p">Password</label><input id="p" type="password"></p>
  <button>Log In</button> <button>Create a User Account</button>
</template>
<template data-title="Business Formation">
  <h1>Business Formation</h1>
  <h2>Create Business</h2>
  <p><label for="t">Business Type</label><select id="t"><option></option><option>Domestic Limited Liability Company</option></select></p>
  <button>Continue</button>
</template>
<template data-title="Business Name">
  <h1>Business Name</h1>
  <p><label for="n">Business Name</label><input id="n"></p>
  <h2>Principal Office Address</h2><p><label for="a">Address Line 1</label><input id="a"></p>
  <button>Continue</button>
</template>
<template data-title="Registered Agent">
  <h1>Registered Agent</h1>
  <button>Create Registered Agent</button> <button>Continue</button>
</template>
<template data-title="Certification">
  <h1>Certification</h1>
  <p><label><input type="checkbox"> I certify that the information is true and correct.</label></p>
  <p><label for="s">Authorizer Signature</label><input id="s"></p>
  <button>Continue</button>
</template>
<template data-title="Review">
  <h1>Review</h1>
  <p>Business Name: Lotus Tea House LLC</p>
  <button>Edit Info</button> <button>Back</button> <button>Submit</button>
</template>
<template data-title="Payment">
  <h1>Payment</h1>
  <p><label><input type="radio" name="s"> Regular processing</label></p>
  <button>Click to Pay</button>
</template>
<template data-title="Thank You">
  <h1>Thank You</h1>
  <a href="#home">Return to Home</a>
</template>
</body></html>
