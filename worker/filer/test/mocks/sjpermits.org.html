<!doctype html>
<!-- Static copy of the SJPermits pages the City of San José's online permit guides document (Apply for New Permit, the
     property search, collaborators, additional information, the Terms and Conditions screen, Payment Details and Post
     Submission Instructions), for a tenant improvement. Written from the guides, not recorded from the live site. -->
<html><head><meta name="replay-form" content="sj-building-ti"></head><body>
<template data-title="Login">
  <h1>Login</h1>
  <p><label for="u">Email</label><input id="u"></p>
  <p><label for="p">Password</label><input id="p" type="password"></p>
  <button>Log In</button>
</template>
<template data-title="My Services">
  <h1>My Services</h1>
  <button>Apply for New Permit</button> <button>Schedule an Inspection</button>
</template>
<template data-title="Add New Application">
  <h1>Add New Application</h1>
  <p><label for="g">Permit Group</label><select id="g"><option>Building</option></select></p>
  <p><label for="w">Work Type</label><select id="w"><option>Tenant Improvement</option></select></p>
  <button>Next</button>
</template>
<template data-title="Search for Property Information">
  <h1>Search for Property Information</h1>
  <p><label for="ad">Address</label><input id="ad"></p>
  <button>Search</button> <button>Next</button>
</template>
<template data-title="Project Collaborators">
  <h1>Project Collaborators</h1>
  <button>Add Collaborator</button> <button>Next</button>
</template>
<template data-title="Additional Information">
  <h1>Additional Information</h1>
  <p><label for="v">Valuation</label><input id="v"></p>
  <button>Next</button>
</template>
<template data-title="City of San Jose Permit: Terms and Conditions">
  <h1>City of San Jose Permit: Terms and Conditions</h1>
  <p><label><input type="checkbox"> I have read and agree to the Terms and Conditions</label></p>
  <button>Back</button> <button>Save and Resume Later</button> <button>Next</button>
</template>
<template data-title="Payment Details">
  <h1>Payment Details</h1>
  <p><label for="cc">Card Number</label><input id="cc" autocomplete="cc-number"></p>
  <button>Pay</button>
</template>
<template data-title="Post Submission Instructions">
  <h1>Post Submission Instructions</h1>
  <p>Congratulations, you have successfully completed the initial application phase.</p>
</template>
</body></html>
