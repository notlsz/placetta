<!doctype html>
<!-- The online BOIR as FinCEN's Step-by-Step Instructions show it; the first two pages as seen on the live site 2026-10-24. -->
<html><head><meta name="replay-form" content="fincen-boir"></head><body>
<template data-title="BOI E-FILING">
  <h1>File the Beneficial Ownership Information Report (BOIR)</h1><h2>Select the filing method that works best for you:</h2><p><a href="#html">Prepare &amp; Submit BOIR</a></p><p><a href="#pdf">Prepare BOIR</a></p>
</template>
<template data-title="BOI E-FILING">
  <h1>Beneficial Ownership Information Report (BOIR)</h1><h2>WARNING!</h2><p>You are entering a U.S. Government information system.</p><button>Cancel</button> <button>I Agree</button>
</template>
<template data-title="BOI E-FILING">
  <h1>Filing Information</h1><p><label><input type="radio" name="t"> Initial report</label></p><button>Next</button>
</template>
<template data-title="BOI E-FILING">
  <h1>Reporting Company</h1><p><label for="ln">Reporting Company legal name</label><input id="ln"></p><button>Previous</button> <button>Next</button>
</template>
<template data-title="BOI E-FILING">
  <h1>Company Applicant(s)</h1><p><label for="cn">Last name</label><input id="cn"></p><button>Previous</button> <button>Next</button>
</template>
<template data-title="BOI E-FILING">
  <h1>Beneficial Owner(s)</h1><p><label for="img">Identifying document image</label><input id="img" type="file"></p><button>Previous</button> <button>Next</button>
</template>
<template data-title="BOI E-FILING">
  <h1>Submit</h1><p><label for="em">Email</label><input id="em"></p><p><label><input type="checkbox"> I agree</label></p><button>Previous</button> <button>Submit BOIR</button>
</template>
<template data-title="BOI E-FILING">
  <h1>Submission Status Confirmation</h1><p>BOIR ID 12345678</p>
</template>
</body></html>
