<!doctype html>
<!-- Static copy of the bizfile Online pages the Secretary of State's help guides document (Login, Forms with the Business
     tab and its File Online pop-up, the form wizard, Review, File Document, the Shopping Cart and My Work Queue), for
     the foreign LLC registration. Written from the guides, not recorded from the live site. -->
<html><head><meta name="replay-form" content="ca-llc-5"></head><body>
<template data-title="Login">
  <h1>Login</h1>
  <p><label for="u">Username</label><input id="u"></p>
  <p><label for="p">Password</label><input id="p" type="password"></p>
  <button>Sign In</button>
</template>
<template data-title="Forms">
  <h1>Forms</h1>
  <div role="tablist"><span>Business</span> <span>UCC</span></div>
  <p><a href="#llc5">Application to Register a Foreign LLC</a></p>
  <div role="dialog"><h2>Application to Register a Foreign LLC</h2><p>Fee: $70.00</p><button>File Online</button></div>
</template>
<template data-title="Application to Register a Foreign LLC">
  <h1>Application to Register a Foreign LLC</h1>
  <p><label for="n">LLC Name</label><input id="n"></p>
  <button>Save Draft</button> <button>Previous Step</button> <button>Next Step</button>
</template>
<template data-title="Attachments">
  <h1>Attachments</h1>
  <p><label for="f">Certificate of Good Standing</label><input id="f" type="file"></p>
  <button>Previous Step</button> <button>Next Step</button>
</template>
<template data-title="Review">
  <h1>Review</h1>
  <p>LLC Name: Lotus Tea House LLC</p>
  <button>Previous Step</button> <button>Next Step</button>
</template>
<template data-title="File Document">
  <h1>File Document</h1>
  <button>Print and Mail</button> <button>File Online</button>
</template>
<template data-title="Shopping Cart">
  <h1>Shopping Cart</h1>
  <button>File/Order Additional Items</button> <button>Checkout</button>
</template>
<template data-title="My Work Queue">
  <h1>My Work Queue</h1>
  <p>Application to Register a Foreign LLC: Pending Review</p>
</template>
</body></html>
