<!doctype html>
<!-- The New Business Registration Form as the Treasurer's detailed instructions describe it; the first page as seen on the live site 2026-10-24. -->
<html><head><meta name="replay-form" content="sf-business-registration"></head><body>
<template data-title="New Business Registration Form">
  <h1>Organization Type</h1><p><label for="o">What is the organization type of this business? *</label><select id="o"><option>Limited Liability Company</option></select></p><p>Is this business a non-profit? <label><input type="radio" name="np"> Yes</label> <label><input type="radio" name="np"> No</label></p><a href="#c">Cancel</a> <button>Continue</button>
</template>
<template data-title="New Business Registration Form">
  <h1>Business Identification</h1><p><label for="bn">Business Name</label><input id="bn"></p><button>Continue</button>
</template>
<template data-title="New Business Registration Form">
  <h1>Change of Ownership</h1><p>Is this a change of ownership for an existing business? <label><input type="radio" name="c"> No</label></p><button>Continue</button>
</template>
<template data-title="New Business Registration Form">
  <h1>Ownership Information</h1><p><label for="on">Owner Name</label><input id="on"></p><button>Continue</button>
</template>
<template data-title="New Business Registration Form">
  <h1>Business Information</h1><p><label for="em">Average number of employees per week</label><input id="em"></p><button>Continue</button>
</template>
<template data-title="New Business Registration Form">
  <h1>Taxes and Fees</h1><p><label><input type="checkbox"> Gross receipts tax</label></p><button>Continue</button>
</template>
<template data-title="New Business Registration Form">
  <h1>Location Details</h1><p><label for="ld">Location Name, Trade Name or DBA</label><input id="ld"></p><button>Continue</button>
</template>
<template data-title="New Business Registration Form">
  <h1>Review &amp; Submit</h1><p>Review and confirm the information you entered.</p><button>Edit</button> <button>Submit for Electronic Signature</button>
</template>
<template data-title="New Business Registration Form">
  <h1>Sign with DocuSign</h1><p>You will receive an email from DocuSign at the business email address.</p>
</template>
</body></html>
