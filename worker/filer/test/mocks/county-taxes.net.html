<!doctype html>
<!-- Static copy of the BTExpress pages the Hillsborough County Tax Collector's BTExpress User Guide documents (steps 2 to
     11). Written from the guide, not recorded from the live site. -->
<html><head><meta name="replay-form" content="hc-business-tax"></head><body>
<template data-title="BTExpress">
  <h1>BTExpress</h1>
  <p><a href="#new">Apply for a new Business Tax account</a></p>
  <p><a href="#renew">Renew a Business Tax account</a></p>
</template>
<template data-title="Required Documentation">
  <h1>Required Documentation</h1>
  <p>Is the business located in a home? <label><input type="radio" name="h"> True</label> <label><input type="radio" name="h"> False</label></p>
  <button>Next</button>
</template>
<template data-title="Business And Owner">
  <h1>Business And Owner</h1>
  <p><label for="bn">Business name</label><input id="bn"></p>
  <p><label for="ein">EIN</label><input id="ein"></p>
  <button>Back</button> <button>Next</button>
</template>
<template data-title="Fictitious (DBA)">
  <h1>Fictitious (DBA)</h1>
  <p><label for="fn">Fictitious name registration number</label><input id="fn"></p>
  <button>Next</button>
</template>
<template data-title="Occupation Information">
  <h1>Occupation Information</h1>
  <p><label for="o">Primary function of the business</label><input id="o"></p>
  <button>Next</button>
</template>
<template data-title="Submit Documentation">
  <h1>Submit Documentation</h1>
  <p><label for="f">Document image</label><input id="f" type="file"></p>
  <button>Next</button>
</template>
<template data-title="Affidavit">
  <h1>Affidavit</h1>
  <p>I affirm that the information provided is true and correct.</p>
  <button>Back</button> <button>I Agree</button>
</template>
<template data-title="Completed">
  <h1>Completed</h1>
  <p>Remain on this page until you receive an email from BTExpress.</p>
</template>
</body></html>
