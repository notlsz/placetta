<!doctype html>
<!-- Static copy of the My Health Department pages Austin Public Health's Fixed Food Establishments page documents for
     the Pre-Opening Inspection ("Log in to your account", "Select: Retail and Wholesale Food Applications -> Pre-Opening
     Inspection", "Complete the application", "Upload required documents, sign, and submit", "Past Submissions").
     Written from the guide, not recorded from the live site. -->
<html><head><meta name="replay-form" content="aus-food-preopening"></head><body>
<template data-title="Login">
  <h1>Login</h1>
  <p><label for="e">Email</label><input id="e" type="email"></p>
  <p><label for="p">Password</label><input id="p" type="password"></p>
  <button>Log In</button>
</template>
<template data-title="Applications">
  <h1>Applications</h1>
  <h2>Retail and Wholesale Food Applications</h2>
  <p><a href="#preopen">Pre-Opening Inspection</a></p>
</template>
<template data-title="Pre-Opening Inspection Application">
  <h1>Pre-Opening Inspection Application</h1>
  <p><label for="n">Establishment Name *</label><input id="n"></p>
  <p><label for="a">Establishment Address *</label><input id="a"></p>
  <button>Next</button>
</template>
<template data-title="Documents">
  <h1>Documents</h1>
  <p><label for="f">Required documents</label><input id="f" type="file"></p>
  <button>Next</button>
</template>
<template data-title="Signature">
  <h1>Signature</h1>
  <p><label for="s">Type your full name to sign</label><input id="s"></p>
  <button>Next</button>
</template>
<template data-title="Review">
  <h1>Review</h1>
  <p>Establishment Name: Lotus Tea House</p>
  <button>Back</button> <button>Submit</button>
</template>
<template data-title="Past Submissions">
  <h1>Past Submissions</h1>
  <p>Pre-Opening Inspection: Submitted</p>
</template>
</body></html>
