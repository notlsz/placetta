# Render Blueprint: the portal worker that files on agency websites (worker/filer). SETUP.md "Turn on online filing".
# Render, New, Blueprint, pick this repo, paste the four values marked sync: false, Apply. That's all on Render.
#
# A web service, not a background worker, so Render gives it a health check (/healthz: are the keys set, did the last
# heartbeat reach the database) and a public https address (RENDER_EXTERNAL_URL) for the live browser a person uses
# when a filing needs them (a CAPTCHA, a code sent to their phone, the agency's fee), and for the app's wake ping
# (POST /wake, with FILER_SECRET). Nothing else is served.
#
# The $0 start: Render's free plan (512 MB, sleeps after 15 minutes without a request, wakes on the next one in about a
# minute) with the browser on Steel's free plan (steel.dev). No Chromium runs in this container, so it fits. When a
# filing is queued for an agency's website, Supabase pings FILER_URL/wake; the worker files, then sleeps again.
#
# Switching later is one line each (the container is the same plain Docker image everywhere):
#   bigger plan, always on      plan: standard                    (2 GB, about $25 a month; then FILER_URL is optional)
#   Chromium in this container  BROWSER_PROVIDER value: local     (needs plan: standard; Chromium is killed in 512 MB)
#   Browserbase only            BROWSER_PROVIDER value: browserbase, with BROWSERBASE_API_KEY, BROWSERBASE_PROJECT_ID (the
#                               default value browserbase,steel already puts it first once its keys are set)
#   off Render (Cloud Run, Fly)  build worker/filer/Dockerfile, set the same variables plus FILER_PUBLIC_URL (its https
#                               address), and point the Supabase secret FILER_URL at it
services:
  - type: web
    name: placetta-filer
    runtime: docker
    dockerfilePath: ./worker/filer/Dockerfile
    dockerContext: .
    plan: free                           # $0, sleeps when idle and wakes on the app's ping. One-line switch: plan: standard
    region: oregon                       # US West, near the California agencies and the Supabase project
    numInstances: 1                      # one container; FILER_CONCURRENCY runs more filings inside it
    healthCheckPath: /healthz            # 503 until every key is set, so a deploy with a missing key shows as failed
    autoDeploy: true
    buildFilter:
      paths:
        - worker/filer/**
        - src/renewal.ts
        - supabase/functions/_shared/agent_inbox.ts
        - supabase/functions/_shared/ai_cost.ts
        - supabase/functions/_shared/cache_rates.ts
        - supabase/functions/_shared/carry.ts
        - supabase/functions/_shared/injection.ts
        - supabase/functions/_shared/zdr.ts
        - supabase/functions/file/accounts.ts
        - supabase/functions/file/captcha.ts
        - supabase/functions/file/destinations.ts
        - supabase/functions/file/dest/midatlantic.ts
        - supabase/functions/file/dest/plains.ts
        - supabase/functions/file/dest/west.ts
        - supabase/functions/file/dest/midwest.ts
        - supabase/functions/file/dest/newengland.ts
        - supabase/functions/file/dest/south.ts
        - supabase/functions/file/dest/products.ts
    envVars:
      # ---- the four values to paste when Render asks ----
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                      # Supabase, Project Settings, API keys, service_role "secret" key. Later, swap it for FILER_DB_KEY (docs/soc2/runbooks/filer-least-privilege.md)
      - key: ANTHROPIC_API_KEY
        sync: false                      # console.anthropic.com, Settings, API keys, Create key (starts sk-ant-)
      - key: STEEL_API_KEY
        sync: false                      # app.steel.dev, sign up (free plan), API Keys. Not needed with BROWSER_PROVIDER local
      - key: BROWSERBASE_API_KEY
        sync: false                      # browserbase.com, Developer plan ($20 a month), Settings, API Key. Left empty: runs use Steel
      - key: BROWSERBASE_PROJECT_ID
        sync: false                      # browserbase.com, Settings, Project ID
      - key: FILER_SECRET
        generateValue: true              # Render makes a random 256-bit value; copy it from the service's Environment tab to the Supabase secret FILER_SECRET
      # ---- set for you ----
      - key: BROWSER_PROVIDER
        value: browserbase,steel         # the order a run tries: Browserbase first (Developer, $20 a month: 100 browser hours, 6-hour
                                         # sessions, recording off), Steel when Browserbase refuses (free plan: 15-minute sessions, every
                                         # session recorded). Until BROWSERBASE_API_KEY and BROWSERBASE_PROJECT_ID are set, Browserbase is
                                         # skipped and runs go to Steel as before. Add ,local on plan standard (Chromium in this container)
      - key: SUPABASE_URL
        value: https://esquxzcfsylffuijvzec.supabase.co
      - key: FILER_ENABLED
        value: "1"                       # 0 stops the worker taking filings
      - key: FILER_TWO_KEY
        value: "10"                      # each form's first 10 filings stop at the agency's review page for a person on the team to check
      - key: FILER_ALLOW_UNVERIFIED
        value: "1"                       # playbooks not yet watched on the live site run, and always stop at the review page for the team; 0 sends them to the team instead
      - key: FILER_CONCURRENCY
        value: "1"                       # filings side by side in this container (up to 4; with local Chromium about 500 MB each)
      - key: FILER_PROBE_HOUR
        value: "10"                      # UTC hour of the nightly re-check of every playbook against the agencies' public pages (10 = 3 a.m. Pacific; with a remote browser only when FILER_PROBE=1)
      - key: NODE_OPTIONS
        value: "--max-old-space-size=320" # fits the free plan's 512 MB; on standard, 512
      # ---- optional, add later in Render, placetta-filer, Environment ----
      # Odelia's models (SETUP.md "Odelia's models"): any one key runs the worker; a second keeps it filing when one
      # vendor hits a spend limit or goes down (each step tries the next, and a model call has no side effects)
      # GEMINI_API_KEY, GEMINI_PAID=1      Gemini 3.8 Flash (native API, function calling); without GEMINI_PAID=1 the key gets
      #                                    no filing (Google's free tier may use prompts)
      # OPENROUTER_API_KEY                 openrouter.ai: anthropic/claude-sonnet-5.5 through hosts other than our Anthropic
      #                                    account, or any model in FILER_MODELS; hosts that keep or train on prompts are refused
      # MUSE_API_KEY                       dev.meta.ai: Meta's muse-spark-1.3 (never a -contributor model)
      # FILER_MODELS                       the order, e.g. anthropic:claude-sonnet-5-5,gemini:gemini-3.8-flash,openrouter:anthropic/claude-sonnet-5.5
      #                                    (else ODELIA_MODELS, else Anthropic, Gemini, OpenRouter, Muse, whichever have keys)
      # FILER_MODEL_COOLDOWN_S             seconds a vendor that hit a limit or was down sits out (default 120)
      # FILER_DB_KEY                       the filer's own least-privilege key (runbook above); then delete SUPABASE_SERVICE_ROLE_KEY
      # BROWSERBASE_API_KEY, BROWSERBASE_PROJECT_ID
      #                                    browserbase.com (Developer plan), Settings: first in BROWSER_PROVIDER's order; with
      #                                    local alone, only the agency sites that refuse a cloud server's address (EDD
      #                                    e-Services, bizfile Online, MassTaxConnect, sanjoseca.gov: worker/filer/src/env.ts)
      # BROWSERBASE_VERIFIED=1             Browserbase "Verified" browsers (Scale plan only; with its proxies): fewer bot checks.
      #                                    Web Bot Auth (Cloudflare signed agents) is switched on for the account by Browserbase
      #                                    on request (browserbase.com/contact-web-bot-auth), not per session. Nothing solves a CAPTCHA
      # FILER_MODEL_FAST                   the cheap model for routine steps (default anthropic:claude-haiku-5-5)
      # FILER_MODEL_STRONG                 the strong model for review pages, final submit, deficiency pages and hard pages
      #                                    (default anthropic:claude-opus-5-5); each fails over through FILER_MODELS' vendors
      # FILER_ADVISOR=0                    no Opus advisor for the fast model (default on: Haiku consults Opus mid-step)
      # FILER_ADVISOR_MAX                  advisor calls a run may make at most (default 3)
      # FILER_BROWSERBASE_HOSTS            more hosts for Browserbase with BROWSER_PROVIDER local, or "*" for every filing
      # STEEL_SESSION_MS                   how long a Steel session may live (default 1800000, 30 minutes; your Steel plan caps it)
      # STRIPE_ISSUING_ON                  1 once Stripe approves Issuing (SETUP.md "Stripe Issuing"): Odelia pays authorized
      #                                    agency fees with a single-use card. Steel records sessions, so it never pays
      #                                    there: use local or browserbase
      # FILER_PROBE=1                      the nightly re-check with a remote browser too (spends the provider's minutes)
      # FILER_KEEP_AWAKE=0                 don't ask for its own /healthz while a filing runs (only for a plan that never sleeps)
      # FILER_DRY_RUN=1                    every filing stops at the agency's review page; nothing is sent
      # FILER_STATUS_CHECKS=0              no portal status checks (signing in with the saved login to read a filing's status)
      # ODELIA_NUMBER                      Odelia's Telnyx number (the same as odelia-sms's): when an agency texts the owner a
      #                                    code for an account Odelia is making, the owner forwards it there in one tap
      # FILER_ACCOUNT_MAIL_MINUTES         how long to wait for an agency's verification email (default 10, at most 30)
